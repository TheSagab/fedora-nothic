---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Variant A of this image: no NVIDIA driver.
# Variant B lives in recipes/recipe-nvidia.yml and only differs by including
# recipes/nvidia/akmods.yml.
#
# The build matrix in .github/workflows/build.yml builds both.

# published as ghcr.io/<your-github-user>/<name>
name: fedora-nothic
description: Fedora Atomic (Universal Blue base) with niri, the Noctalia shell and mise.

# Universal Blue's desktop-less base. Fedora 44, includes codecs, hardware
# acceleration, distrobox/toolbox, just/ujust and the ublue signing keys.
base-image: ghcr.io/ublue-os/base-main
# Pin the Fedora release instead of "latest" so the image only moves when we
# say so. Bump this (and re-check packages) to move to a new Fedora.
image-version: 44

# Everything shared between the plain and the NVIDIA variant.
modules:
  - from-file: common/00-base.yml
  # Terra must come before anything that installs from it: the greeter in
  # 10-niri.yml and ghostty in 30-apps.yml.
  - from-file: common/05-terra.yml
  - from-file: common/10-niri.yml
  - from-file: common/20-noctalia.yml
  - from-file: common/30-apps.yml
  - from-file: common/40-devtools.yml
  - from-file: common/50-files.yml
  - from-file: common/60-system.yml
  - from-file: common/90-final.yml
