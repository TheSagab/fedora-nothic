---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Base system: things that are not niri/Noctalia specific but a Wayland desktop
# needs. Everything here is installed on top of ghcr.io/ublue-os/base-main.
#
# Only packages the base image does *not* already provide are listed: an entry
# for something already present is a no-op. Where a whole group is inherited,
# the comment says so, so the requirement is still written down. The lists were
# trimmed against the base image's own rpm database, which is the only reliable
# check - some of what it carries is a dependency of something else it installs
# rather than an explicit choice, and dnf cannot tell you which.
#
#   podman run --rm ghcr.io/ublue-os/base-main:44 rpm -qa --qf '%{NAME}\n'

modules:
  - type: dnf
    install:
      # Weak dependencies are off so the image stays predictable: niri alone
      # would otherwise pull in waybar, alacritty and swaylock through
      # Recommends. Everything we actually want is listed explicitly.
      install-weak-deps: false
      packages:
        # --- graphics / rendering stack ---------------------------------
        # Only vulkan-tools is listed. Everything else here is already part of
        # the base image: mesa's drivers, its EGL, GL and Vulkan ICDs, and
        # libva-utils. That is not an accident of dependencies - the base image
        # distro-syncs exactly those packages against negativo17's
        # fedora-multimedia repository - so listing them again would be a no-op.
        #
        # vulkan-tools is the one piece the base does not carry, and it is the
        # diagnostic half of the stack: vulkaninfo. Zed needs the driver
        # (mesa-vulkan-drivers), which now comes from the base like the rest.
        - vulkan-tools

        # --- networking -------------------------------------------------
        # In the base image: NetworkManager and its wifi and bluetooth
        # subpackages, and bluez, which NetworkManager-bluetooth requires.
        # bluez-tools, the BlueZ command line front end, is not.
        - bluez-tools

        # --- audio (Noctalia talks to PipeWire directly) ----------------
        # In the base image: the whole PipeWire stack, pipewire, pipewire-alsa,
        # pipewire-pulseaudio, pipewire-utils and wireplumber. pipewire itself
        # is a hard requirement of pipewire-libs-extra, one of the base image's
        # own packages. This is the most incidental group in the file, so if
        # audio ever breaks after a base rebuild, these five are what to add
        # back here.
        #
        # playerctl, which the media keys use, is not in the base.
        - playerctl

        # --- power / hardware -------------------------------------------
        # upower is in the base image; these two are not.
        - brightnessctl
        - ddcutil

        # --- secrets (needed for Noctalia clipboard history / CalDAV) ---
        # Not in the base image, and it is also what niri's niri-portals.conf
        # names for org.freedesktop.impl.portal.Secret.
        - gnome-keyring

        # --- fonts and icons --------------------------------------------
        # The base image already carries google-noto-emoji-fonts,
        # adwaita-cursor-theme (required by adwaita-icon-theme) and
        # sound-theme-freedesktop (required by libcanberra). These are the ones
        # it does not.
        - dejavu-sans-fonts
        - dejavu-sans-mono-fonts
        - google-noto-sans-fonts
        - jetbrains-mono-fonts-all
        - fontawesome-fonts-all
        - papirus-icon-theme

        # --- runtime libraries -------------------------------------------
        # libatomic is the part of GCC's runtime that carries the atomic
        # operations the compiler cannot emit inline on a target (on x86-64,
        # most of the 16-byte ones). Nothing installed from a repository needs
        # it listed, because dnf pulls it in as a dependency; it is here for
        # the binaries that are not packaged - the toolchains mise downloads
        # (Node's official builds, among others) and anything else shipped as a
        # prebuilt tarball. Fedora builds it, so no extra repository is
        # involved, and the package is 36 KiB.
        - libatomic

        # --- session/CLI plumbing ---------------------------------------
        # Already in the base image: xdg-utils, bash-completion, polkit (which
        # udisks2, rtkit and accountsservice all require), flatpak and rsync.
        # xdg-user-dirs is not, and the shells are choices this image makes:
        # fish is the default login shell and zsh is here for anyone who wants
        # it.
        - xdg-user-dirs
        - zsh
        - fish

        # --- login shells, and why there is no util-linux entry here -------
        #
        # There is deliberately no `util-linux` entry. The full package is
        # already part of the base image, because systemd requires it, so
        # `dnf5 install util-linux` is a no-op: it cannot put back anything the
        # base image removed.
        #
        # What is actually missing is /usr/bin/chsh, and the reason is not
        # Fedora's util-linux split. Universal Blue deletes /usr/bin/chsh and
        # /usr/bin/lchsh in every image built from ublue-os/main:
        #
        #   RUN rm -f /usr/bin/chsh && rm -f /usr/bin/lchsh && ...
        #
        # That is deliberate and predates the split (ublue-os/main#598,
        # "[Discussion] Remove chsh"; PR #624, "feat: Stop supporting chsh",
        # merged 2024-08-08). Their reasoning: changing the login shell on an
        # atomic image is a footgun, because an account whose shell is not in
        # the image it booted cannot log in, and a rebase to another image can
        # leave you there. The recommended way to get a particular shell is the
        # terminal's own `command` setting, which is exactly what this image
        # does with `command = /usr/bin/fish` in the ghostty config.
        #
        # So `ujust set-default-shell` (files/justfiles/niri.just) cannot use
        # chsh: it calls usermod through sudo, and checks /etc/shells itself,
        # because usermod does not.
        #
        # To see this on a running image: `rpm -V util-linux` reports
        # `missing     /usr/bin/chsh` while the owning package is installed.

        # --- what the NVIDIA build reaches for ---------------------------
        # Not part of the desktop, but the BlueBuild `akmods` module
        # (recipes/nvidia/akmods.yml) shells out to both, so they have to be
        # present before that module runs. The base image does carry both today
        # (skopeo is required by bootc and rpm-ostree), but only the NVIDIA
        # variant needs them and a build-time dependency that disappears is a
        # confusing failure, so they stay listed.
        - jq
        - skopeo
