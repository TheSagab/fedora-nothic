---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Umbriel (https://github.com/noctalia-dev/umbriel) - a second Wayland
# compositor, from the same people as Noctalia, alongside niri.
#
# niri stays the default session. Both compositors install a
# /usr/share/wayland-sessions/*.desktop file, which is what puts them in the
# greeter's picker, and files/system/var/lib/noctalia-greeter/greeter.toml names
# Niri as the default one. Pick Umbriel at login and the greeter remembers it.
#
# Terra carries it as `umbriel-nightly`, versioned like
# 0^20260918git.1a869f9 - a snapshot of a commit rather than a release, because
# upstream publishes no releases or tags. The package installs /usr/bin/umbriel,
# /usr/bin/start-umbriel, /usr/share/wayland-sessions/umbriel.desktop and the
# umbriel-session/shutdown/service user units.
#
# It hard-requires xdg-desktop-portal-umbriel-nightly, so the portal backend
# arrives with it and is deliberately not listed again below: that is what gives
# Umbriel screencast and screenshot sharing through the portal API, and it ships
# both umbriel.portal and umbriel-portals.conf, which xdg-desktop-portal selects
# from the session's DesktopNames=Umbriel. Umbriel's other requirement,
# xwayland-satellite, is already installed by 10-niri.yml.
#
# There is nothing to pin or bump here: it is a nightly, so each image rebuild
# takes whatever Terra published most recently.

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - umbriel-nightly
