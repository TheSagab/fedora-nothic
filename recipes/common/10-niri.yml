---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# niri, the scrollable-tiling Wayland compositor, plus everything it needs to
# be a usable session: a login manager, XDG desktop portals and XWayland.

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # --- the compositor ---------------------------------------------
        # Fedora ships niri itself; xwayland-satellite is a hard dependency
        # of it and is what gives us XWayland support.
        - niri
        - xwayland-satellite

        # --- login manager ----------------------------------------------
        # greetd is a minimal, compositor-agnostic greeter daemon. The greeter
        # itself is noctalia-greeter, which comes from the Terra repository
        # (recipes/common/05-terra.yml, which must run before this module).
        #
        # noctalia-greeter is a *graphical* greeter: greetd runs
        # /usr/bin/noctalia-greeter-session, which starts the wlroots compositor
        # bundled inside it and draws the login screen in that session. That is
        # why it hard-requires wlroots - Fedora 44 ships 0.20.2, which matches
        # the libwlroots-0.20.so it links against - and why it needs a real
        # logind session for DRM access. Fedora's greetd package already puts
        # pam_systemd.so in /usr/lib/pam.d/greetd-greeter, so that is handled.
        #
        # It reads /var/lib/noctalia-greeter/greeter.toml, which this image
        # creates via a tmpfiles.d entry (see files/system/usr/lib/tmpfiles.d/)
        # owned by the greetd user.
        - greetd
        - noctalia-greeter

        # --- XDG desktop portals ----------------------------------------
        # niri ships /usr/share/xdg-desktop-portal/niri-portals.conf, which
        # picks these two backends: gnome for screencast (screen sharing) and
        # gtk for file pickers, printing and so on. Neither pulls in GNOME
        # Shell.
        #
        # The base image already carries the portal daemon itself and the gtk
        # backend (the daemon arrives as a requirement of
        # xdg-desktop-portal-gtk, which is one of the base image's packages).
        # The gnome backend, which is the one that makes screen sharing work, is
        # not there, so it is the only one listed.
        - xdg-desktop-portal-gnome

        # --- Qt apps on Wayland -----------------------------------------
        - qt5-qtwayland
        - qt6-qtwayland

        # --- output / display helpers -----------------------------------
        - wlr-randr
