---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# The everyday applications a Wayland desktop needs. niri and Noctalia
# deliberately do not bundle a terminal, launcher or file manager, so we pick
# one of each here.
#
# Swap any of these for your favourites - just keep the matching key bindings
# in files/system/etc/niri/config.kdl in sync.
#
# Weight warning: this is by far the heaviest module in the image, and it got
# heavier when the applications below were added. Resolved against an empty root
# with `dnf5 --installroot=<dir> --releasever=44 --use-host-config --assumeno
# install --setopt=install_weak_deps=False`, the modules before this one come to
# 465 packages and ~1 GiB, and this one takes the total to 850 packages and
# ~3 GiB.
#
# Measured on this image instead, so that anything already present costs nothing,
# the largest single additions are:
#
#   calibre            108 packages, 712 MiB   the ebook manager, the biggest item
#   obs-studio          27 packages, 143 MiB   recording and streaming
#   virt-manager        41 packages,  63 MiB   the GUI only, see its comment below
#   zathura-pdf-mupdf    9 packages,  56 MiB
#   transmission-gtk    10 packages,  21 MiB
#
# mpv, Thunar and ghostty were already the bulk of this module before those. If
# you would rather keep the image small, drop Thunar, mpv, calibre and file-roller
# here and install those as Flatpaks instead; for the leanest possible image drop
# ghostty too and keep foot as the only terminal (remember to repoint Mod+T).
#
# Note that Thunar hard-requires xfce4-panel, so that comes along too. It is not
# used for anything (Noctalia owns the bar) - dropping Thunar is the only way to
# get rid of it.

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # --- terminal, launcher, clipboard ------------------------------
        # ghostty is the default terminal (Mod+T in the niri config). It comes
        # from the Terra repository and hard-requires gtk4 and gtk4-layer-shell,
        # which dnf pulls in. foot stays installed as a lightweight fallback.
        #
        # ghostty-shell-integration and ghostty-fish-completion are optional, so
        # with install-weak-deps: false they have to be named explicitly. The
        # fish one matters because fish is this image's default shell.
        - ghostty
        - ghostty-terminfo
        - ghostty-shell-integration
        - ghostty-fish-completion
        - foot
        - fuzzel
        - wl-clipboard

        # --- file manager + its integrations ----------------------------
        # Note the capital T: Fedora's package is called Thunar.
        - Thunar
        - thunar-volman
        - thunar-archive-plugin
        - tumbler
        - gvfs
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        - gvfs-nfs
        - gvfs-fuse
        - gvfs-archive

        # --- media and archives -----------------------------------------
        - imv
        - mpv
        - file-roller
        - 7zip
        - unzip
        - cpio

        # --- screenshots (Noctalia has its own UI, these are for scripts) -
        - grim
        - slurp

        # --- text and documents -----------------------------------------
        # mousepad is a plain GTK editor; zathura is the PDF viewer, with the
        # mupdf backend (poppler is the alternative: zathura-pdf-poppler).
        - mousepad
        - zathura
        - zathura-pdf-mupdf
        - galculator

        # --- monitoring --------------------------------------------------
        # btop is the interactive system monitor, gdu a disk usage analyser.
        # bottom comes from Terra; the other two are in Fedora.
        - btop
        - bottom
        - gdu

        # --- desktop integration -----------------------------------------
        # gammastep is the night light. It is a daemon, so it does nothing until
        # you run it; see the README for the two ways to use it.
        #
        # cliphist needs the watcher and keybinding that the niri config sets
        # up, otherwise the binary has nothing to store.
        #
        # pavucontrol is the volume mixer and blueman the Bluetooth manager;
        # Noctalia has its own control centre, but these go deeper.
        - gammastep
        - cliphist
        - pavucontrol
        - blueman

        # --- applications ------------------------------------------------
        # virt-manager is only the GUI. To actually run a VM you also need
        # libvirt-daemon-kvm (which pulls the qemu stack, +169 packages) and
        # your account in the libvirt group. See the README.
        - transmission-gtk
        - calibre
        - obs-studio
        - virt-manager
