---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# The everyday applications a Wayland desktop needs. niri and Noctalia
# deliberately do not bundle a terminal, launcher or file manager, so we pick
# one of each here.
#
# Swap any of these for your favourites - just keep the matching key bindings
# in files/system/etc/niri/config.kdl in sync.
#
# Weight warning: this is by far the heaviest module in the image, and it got
# heavier when the applications below were added. Resolved against an empty root
# with `dnf5 --installroot=<dir> --releasever=44 --use-host-config --assumeno
# install --setopt=install_weak_deps=False`, the modules before this one come to
# 465 packages and ~1 GiB, and this one takes the total to 1022 packages and
# ~3 GiB. libvirt-daemon-kvm alone accounts for 163 of those packages and 261 MiB,
# which is the qemu stack behind virt-manager.
#
# The two totals above are a little high now: they count packages the base image
# already provides, and the declared list has since been trimmed of them. The
# note in the README's "Re-checking this configuration yourself" section has the
# detail. The marginal figures below are unaffected, because a package that was
# already present in the image costs nothing.
#
# Measured on this image instead, so that anything already present costs nothing,
# the largest single additions are:
#
#   calibre            108 packages, 712 MiB   the ebook manager, the biggest item
#   obs-studio          27 packages, 143 MiB   recording and streaming
#   virt-manager        41 packages,  63 MiB   the GUI; libvirt above is the rest
#   zathura-pdf-mupdf    9 packages,  56 MiB
#   transmission-gtk    10 packages,  21 MiB
#
# mpv and Thunar were already the bulk of this module before those. If you would
# rather keep the image small, drop Thunar, mpv, calibre and file-roller here and
# install those as Flatpaks instead. monstar is not part of the package set at
# all - the script module at the bottom of this file installs it - and foot is a
# single small Fedora package.
#
# Note that Thunar hard-requires xfce4-panel, so that comes along too. It is not
# used for anything (Noctalia owns the bar) - dropping Thunar is the only way to
# get rid of it.

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # --- terminal, launcher, clipboard ------------------------------
        # monstar is the primary terminal (Mod+T in the niri config). Neither
        # Fedora nor Terra packages it, so the script module at the bottom of
        # this file installs the upstream release tarball; the pin and checksum
        # are there. foot stays installed as the lightweight fallback on
        # Mod+Shift+T.
        #
        # ghostty-terminfo stays even though ghostty itself is gone. monstar
        # 1.0.1 forces TERM=xterm-ghostty for the shell it starts (its own TERM
        # and terminfo install arrived after that release), and this package is
        # just that one terminfo entry. Without it, curses programs in the
        # terminal fail with "unknown terminal type". It can go once monstar's
        # releases switch to TERM=monstar and install their own definition.
        - ghostty-terminfo
        - foot
        - fuzzel
        # wl-clipboard is not repeated here: it is in Universal Blue's own
        # package list for the base image, not merely a dependency of something
        # else, so it is present either way. cliphist and the Mod+Ctrl+V
        # binding above still work as described.

        # --- file manager + its integrations ----------------------------
        # Note the capital T: Fedora's package is called Thunar.
        - Thunar
        - thunar-volman
        - thunar-archive-plugin
        - tumbler
        - gvfs
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        - gvfs-nfs
        - gvfs-fuse
        - gvfs-archive

        # --- media and archives -----------------------------------------
        # 7zip, unzip and cpio are already in the base image: cpio is required
        # by dracut and plymouth-scripts, unzip by zip and braille-printer-app.
        # file-roller, the archive UI thunar-archive-plugin drives, is not.
        - imv
        - mpv
        - file-roller

        # --- screenshots (Noctalia has its own UI, these are for scripts) -
        - grim
        - slurp

        # --- text and documents -----------------------------------------
        # mousepad is a plain GTK editor; zathura is the PDF viewer, with the
        # mupdf backend (poppler is the alternative: zathura-pdf-poppler).
        - mousepad
        - zathura
        - zathura-pdf-mupdf
        - galculator

        # --- monitoring --------------------------------------------------
        # btop is the interactive system monitor, gdu a disk usage analyser.
        # bottom comes from Terra; the other two are in Fedora.
        - btop
        - bottom
        - gdu

        # --- desktop integration -----------------------------------------
        # gammastep is the night light. It is a daemon, so it does nothing until
        # you run it; see the README for the two ways to use it.
        #
        # cliphist needs the watcher and keybinding that the niri config sets
        # up, otherwise the binary has nothing to store.
        #
        # pavucontrol is the volume mixer and blueman the Bluetooth manager;
        # Noctalia has its own control centre, but these go deeper.
        - gammastep
        - cliphist
        - pavucontrol
        - blueman

        # --- capture and hardware ----------------------------------------
        # satty annotates a screenshot, wf-recorder records the screen (both
        # pair with the Print bindings and grim/slurp above) and guvcview is
        # the webcam viewer. fwupd, which provides fwupdmgr for firmware
        # updates, is already in the base image.
        #
        # satty comes from Terra; the other two are in Fedora.
        - satty
        - wf-recorder
        - guvcview

        # --- applications ------------------------------------------------
        # virt-manager plus the daemon it talks to. libvirt-daemon-kvm is the
        # qemu/KVM driver and the qemu stack behind it; Fedora's own preset
        # (90-default.preset) enables virtqemud.service and the virtqemud,
        # virtproxyd, virtnetworkd and virtnodedevd sockets, so the image needs
        # no systemctl line of its own. The one step that cannot be baked in is
        # the group membership, because the account does not exist at build
        # time: `ujust libvirt-setup` does it, see the README.
        - virt-manager
        - libvirt-daemon-kvm
        - transmission-gtk
        - calibre
        - obs-studio

  # --- monstar -------------------------------------------------------------
  # monstar (https://github.com/rockorager/monstar) is a native Wayland
  # terminal built on libghostty's terminal core, not Ghostty's GTK front end:
  # no GTK, no gtk4-layer-shell, a CPU renderer like foot, and it links only the
  # Wayland, Fontconfig, FreeType, HarfBuzz and xkbcommon libraries the image
  # already has.
  #
  # It is in neither Fedora nor Terra, and upstream only publishes a prebuilt
  # x86_64 Linux tarball alongside the source. The tarball installs the
  # executable, desktop entry, icon, man pages and bundled themes; the pin and
  # the checksum are what keep a daily rebuild from silently taking a different
  # build. To update, change VERSION and SHA256 together; the digest is the
  # release asset's SHA-256 from
  # https://github.com/rockorager/monstar/releases.
  #
  # Building from source instead would mean downloading Zig (the release
  # requires 0.16, which Fedora does have, but the development branch requires
  # 0.17), plus a ghostty-core build in the image, for no gain over the release
  # binary. The x86_64 guard below is explicit because there is no other
  # architecture to fall back to.
  - type: script
    snippets:
      - |
        set -eu
        VERSION=1.0.1
        SHA256=271fcf68d3e67350327eba43c061f0bd904ec4e5a7049ee60d7c9e79991d4bbc
        case "$(uname -m)" in
          x86_64) : ;;
          *) echo "ERROR: monstar publishes no binary for $(uname -m)." >&2; exit 1 ;;
        esac
        url="https://github.com/rockorager/monstar/releases/download/v${VERSION}/monstar-${VERSION}-x86_64-linux.tar.gz"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/monstar.tar.gz" "$url"
        echo "$SHA256  $tmp/monstar.tar.gz" | sha256sum -c -
        tar -xzf "$tmp/monstar.tar.gz" -C "$tmp"
        root="$tmp/monstar-${VERSION}-x86_64-linux"
        install -Dm0755 "$root/bin/monstar" /usr/bin/monstar
        cp -a "$root/share/." /usr/share/
        actual="$(/usr/bin/monstar --version)"
        if [ "$actual" != "monstar $VERSION" ]; then
          echo "ERROR: monstar reports '$actual', expected 'monstar $VERSION'." >&2
          exit 1
        fi
        echo "$actual installed from the upstream release tarball."
