---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# The everyday applications a Wayland desktop needs. niri and Noctalia
# deliberately do not bundle a terminal, launcher or file manager, so we pick
# one of each here.
#
# Swap any of these for your favourites - just keep the matching key bindings
# in files/system/etc/niri/config.kdl in sync.
#
# Weight warning: this is the heaviest module in the image. Resolved against an
# empty root with `dnf5 --installroot=<dir> --releasever=44 --use-host-config
# --assumeno install --setopt=install_weak_deps=False`, the modules before this
# one come to 465 packages and ~1 GiB, and this one takes the total to 662
# packages and ~2 GiB. Three stacks account for it, measured the same way and
# each including the base system that package needs, so the figures overlap:
#
#   mpv      365 packages, 758 MiB   the ffmpeg stack
#   Thunar   294 packages, 471 MiB   XFCE and gvfs
#   ghostty  229 packages, 653 MiB   gtk4, libadwaita, gstreamer, cups, mesa
#
# ghostty is in that list because it hard-requires gtk4, which drags the rest in.
# If you would rather keep the image small, drop Thunar, mpv and file-roller here
# and install those as Flatpaks instead; for the leanest possible image drop
# ghostty too and keep foot as the only terminal (remember to repoint Mod+T).
#
# Note that Thunar hard-requires xfce4-panel, so that comes along too. It is not
# used for anything (Noctalia owns the bar) - dropping Thunar is the only way to
# get rid of it.

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # --- terminal, launcher, clipboard ------------------------------
        # ghostty is the default terminal (Mod+T in the niri config). It comes
        # from the Terra repository and hard-requires gtk4 and gtk4-layer-shell,
        # which dnf pulls in. foot stays installed as a lightweight fallback.
        #
        # ghostty-shell-integration and ghostty-fish-completion are optional, so
        # with install-weak-deps: false they have to be named explicitly. The
        # fish one matters because fish is this image's default shell.
        - ghostty
        - ghostty-terminfo
        - ghostty-shell-integration
        - ghostty-fish-completion
        - foot
        - fuzzel
        - wl-clipboard

        # --- file manager + its integrations ----------------------------
        # Note the capital T: Fedora's package is called Thunar.
        - Thunar
        - thunar-volman
        - thunar-archive-plugin
        - tumbler
        - gvfs
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        - gvfs-nfs
        - gvfs-fuse
        - gvfs-archive

        # --- media and archives -----------------------------------------
        - imv
        - mpv
        - file-roller
        - 7zip
        - unzip
        - cpio

        # --- screenshots (Noctalia has its own UI, these are for scripts) -
        - grim
        - slurp
