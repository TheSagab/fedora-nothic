name: bluebuild
on:
  schedule:
    # Rebuild daily so we pick up Fedora/ublue/Noctalia updates. 06:00 UTC is
    # roughly 20 minutes after the Universal Blue base images start building.
    - cron: "00 06 * * *"
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # don't cancel the other variant if one fails
      matrix:
        recipe:
          # !! Keep this list in sync with the files in recipes/
          - recipe.yml # no NVIDIA driver
          - recipe-nvidia.yml # the proprietary NVIDIA driver (see recipes/nvidia/akmods.yml)
    steps:
      # The build is fully handled by the reusable GitHub Action. It needs the
      # cosign private key in the SIGNING_SECRET repository secret - see
      # README.md for the one-time setup.
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # Frees up space on the GitHub runner; the NVIDIA image is large.
          maximize_build_space: true
