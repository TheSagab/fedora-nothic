# State directory for noctalia-greeter.
#
# The greeter keeps greeter.toml (optional admin config) and sync.toml (the last
# session and colour scheme it remembers) in /var/lib/noctalia-greeter, and it
# has to be writable by the user the greeter runs as.
#
# That user is `greetd` on Fedora: greetd's package creates it from
# /usr/lib/sysusers.d/greetd.conf. systemd-tmpfiles runs after systemd-sysusers,
# so the name resolves by the time this entry is applied - which also means the
# uid does not have to be known at image build time (it is allocated
# dynamically).
#
# The `d` line is enough; the greeter creates its own files inside. Fedora's own
# greetd package uses `Z` for /var/lib/greetd, which works too.
#
# This is belt and braces: if the noctalia-greeter package ships its own tmpfiles
# entry, both apply and the result is the same ownership.

d /var/lib/noctalia-greeter 0750 greetd greetd -
