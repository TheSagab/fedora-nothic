# Development-friendly inotify limits.
#
# File watchers used by mise, editors, test runners and bundlers need a lot of
# inotify watches; the kernel default (8192 on many systems) is far too low.
# /usr/lib/sysctl.d is the vendor location and is applied by systemd-sysctl at
# boot. Override locally in /etc/sysctl.d/ if you need to.

fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
