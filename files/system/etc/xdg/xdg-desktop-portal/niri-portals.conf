# Which xdg-desktop-portal backend serves which interface, in the niri session.
# See portals.conf(5).
#
# This file exists to change ONE interface in the contract that the niri package
# ships at /usr/share/xdg-desktop-portal/niri-portals.conf, whose [preferred]
# section it otherwise copies verbatim. It has to sit in /etc/xdg rather than
# /usr/share because that location is searched first, and it has to be named
# niri-portals.conf because a desktop-specific file is preferred over a generic
# portals.conf in the same directory.
#
# The one addition:
#
#   org.freedesktop.impl.portal.FileChooser=gtk
#
# Why it is needed:
#
# xdg-desktop-portal-gnome 50 does not draw the file chooser itself any more. Its
# FileChooser implementation is a D-Bus proxy to the chooser that Nautilus now
# provides; xdg-desktop-portal-gnome's src/filechooser.c creates that proxy
# against "org.gnome.Nautilus". This image installs Thunar and not Nautilus, and
# nothing on it provides that name, so the very first thing the GNOME backend
# does when asked for a file chooser is fail:
#
#   xdg-desktop-portal-gnome[2101]: Delegated FileChooser call failed: The name
#   is not activatable
#
# niri's own contract puts the GNOME backend first for this interface, so that
# failure is what a file chooser got by default here. The visible symptom is that
# a sandboxed application does nothing at all on "Save image as...", "Open
# file...", "Upload" and the download prompt - Chrome, Discord, Steam and
# anything else from Flathub, all of which have to ask the portal, because they
# cannot see the filesystem directly. An application installed from the
# repositories is unaffected, because it draws its own GTK dialog and never asks.
#
# The GTK backend is already installed and does implement FileChooser, and it is
# the backend intended for a wlroots compositor, so pointing that one interface
# at it fixes this with no new package. Everything else is left as niri asks, and
# in particular ScreenCast stays with the GNOME backend, which is what makes
# screen sharing and screen recording work.
#
# The window still has to be made usable: niri would tile it, and the GTK backend
# draws it from its own process, so it is not a dialog of the application as far
# as the compositor can tell. files/system/etc/niri/config.kdl floats it.
#
# To check: `journalctl --user -b | grep FileChooser` prints nothing while a
# chooser works, and the dialog appears with the app id `xdg-desktop-portal-gtk`
# in `niri msg windows`.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
