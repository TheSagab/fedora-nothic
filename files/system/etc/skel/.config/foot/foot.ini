# foot terminal configuration.
# Reference: man foot.ini
#
# foot is the lightweight fallback terminal, bound to Mod+Shift+T in the shipped
# niri configuration. monstar is the primary terminal on Mod+T.

[main]
font=JetBrains Mono:size=11
dpi-aware=yes
pad=10x10
selection-target=clipboard

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=yes

[colors]
# Left at foot's defaults; Noctalia can generate a matching palette for you
# under Settings -> Theming -> App Theming (there is a foot template).
