# Noctalia user configuration.
# Reference: https://docs.noctalia.dev/noctalia/configuration/
#
# Noctalia merges every *.toml in ~/.config/noctalia/ (alphabetically, so you
# can split this into bar.toml, theme.toml, ...), then layers GUI-managed
# overrides from ~/.local/state/noctalia/settings.toml on top.
#
# Anything you change in the Settings window is written to settings.toml, not
# here, so this file stays yours to keep in dotfiles.
#
# Delete this file to go back to Noctalia's built-in defaults.

[theme]
mode = "dark"

# Noctalia's first bar instance is called "default".
[bar.default]
position = "top"

[shell]
# Let typing in niri's overview open Noctalia's launcher.
niri_overview_type_to_launch_enabled = true

[widget.tray]
# Hide Blueman's status icon from the bar.
#
# The image installs blueman, and blueman-applet is autostarted by systemd's
# XDG-autostart generator (from /etc/xdg/autostart/blueman.desktop), so its tray
# icon is there from login whenever a Bluetooth adapter exists. Blueman has no
# setting for this: its StatusIcon plugin recomputes visibility from the adapter
# list every time that list changes, so with an adapter present the icon always
# shows. Hiding the item in Noctalia's tray widget is the supported way, and it
# leaves Blueman itself running, so blueman-manager and the applet's menu are
# unaffected.
#
# The list is matched by exact equality against each tray item's id, title, bus
# name, object path, process name and icon name. "blueman" is the item's
# StatusNotifierItem Id, and it is stable across sessions; do not use its bus
# name, which is a per-session unique name such as :1.47. The object path
# /org/blueman/sni is also stable and works as a second token if the id ever
# changes. Nothing else matches "blueman", and Noctalia's own Bluetooth
# indicator is a bar widget rather than a tray item, so it is not affected.
#
# Delete the two lines below to get the icon back.
hidden = ["blueman"]
